<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Electronics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="index.html">
            Amazon
        </a>
        <form class="d-flex w-50">
            <input
            class="form-control me-2"
            type="search"
            placeholder="search electronics"
            >
            <button class="btn btn-warning" type="submit">
                Search
            </button>
        </form>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center">Amazon Electronics</h1>
        <p class="text-center text-secondary">
                Discover the latest electronics, gadgets, and accessories
        </p>
        <div class="row mt-5">
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <img
                    src="images/headphones.jpg"
                    class="card-img-top"
                    alt="Wireless headphones"
                    style="height: 320px; object-fit: contain;"
                    >
                    <div class="card-body">
                        <h5 class="card-title">Wireless headphones</h5>
                        <p class="card-text">
                            High-quality wireless headphones with clear sound.
                        </p>
                        <p class="fw-bold">KES 1000</p>
                        <button class="btn btn-warning">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100">
                    <img
                    src="images/smartphone.jpg"
                    class="card-img- top"
                    alt="Smartphone"
                    style="height: 320px; object-fit: contain;"
                    >
                    <div class="card-body">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text">A modern smartphone with a clear display.</p>
                        <p class="fw-bold">KES 500</p>
                        <button class="btn btn-warning">Add to cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
